name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_scope_ci
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_scope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate database migration
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: alembic upgrade head
      - name: Lint
        run: ruff check app tests scripts migrations
      - name: Security scan
        run: bandit -q -r app scripts ../examples
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Test with coverage gate
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Run deterministic model smoke evaluation
        run: python -m scripts.evaluate_model
      - name: Exercise migrated PostgreSQL API
        env:
          DATABASE_URL: postgresql+psycopg://sentinel:sentinel-ci@localhost:5432/sentinel_scope_ci
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
          ADMIN_PASSWORD: ci-admin-password
          INGESTION_API_KEY: ci-ingestion-key-with-sufficient-length
        run: |
          alembic upgrade head
          python -m scripts.postgres_smoke

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: |
          pip install -r ../backend/requirements.txt -r ../backend/requirements-dev.txt
          npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run analyst browser flow
        env:
          DATABASE_URL: sqlite:///./e2e.db
          JWT_SECRET: e2e-jwt-secret-with-at-least-thirty-two-characters
          ADMIN_PASSWORD: e2e-admin-password
          INGESTION_API_KEY: e2e-ingestion-key-with-sufficient-length
          CAPTURE_PORTFOLIO_SCREENSHOTS: "1"
        run: npm run test:e2e
      - name: Upload verified portfolio screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-screenshots
          path: frontend/portfolio-screenshots
          if-no-files-found: error
          retention-days: 7

  windows-collector:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate PowerShell collector syntax
        shell: pwsh
        run: |
          $source = Get-Content collectors/windows_security_eventlog.ps1 -Raw
          [void][scriptblock]::Create($source)

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --tag sentinelscope-api:test backend
      - run: docker build --tag sentinelscope-web:test frontend
